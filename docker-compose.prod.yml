version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8010:8010"  # Expose backend API
    expose:
      - "8010"
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_ROOT=/app/storage
    restart: unless-stopped
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8010/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - spelltable-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_UMAMI_SCRIPT_URL=https://analytics.paulhoeller.at/script.js
        - NEXT_PUBLIC_UMAMI_WEBSITE_ID=fc0f76e2-6555-44b0-8550-06ce93cbfd96
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_UMAMI_SCRIPT_URL=https://analytics.paulhoeller.at/script.js
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=fc0f76e2-6555-44b0-8550-06ce93cbfd96
    networks:
      - spelltable-network

networks:
  spelltable-network:
    driver: bridge
